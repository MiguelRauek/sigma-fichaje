name: Fichaje Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar login y estado (no ficha)
        env:
          SIGMA_EMAIL: ${{ secrets.SIGMA_EMAIL }}
          SIGMA_PASS: ${{ secrets.SIGMA_PASS }}
        run: python3 sigma_punch.py --check
