name: Fichaje Salida

on:
  schedule:
    # 15:50 UTC = 17:50 Madrid (verano) / 16:50 (invierno).
    # El script espera hasta su objetivo aleatorio (18:00:00â18:02:59 Madrid).
    - cron: '50 15 * * *'
  workflow_dispatch:

jobs:
  punch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichar salida
        env:
          SIGMA_EMAIL: ${{ secrets.SIGMA_EMAIL }}
          SIGMA_PASS: ${{ secrets.SIGMA_PASS }}
        run: python3 sigma_punch.py --exit
